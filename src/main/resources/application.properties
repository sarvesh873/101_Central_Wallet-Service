spring.application.name=wallet-service

server.port=8085
server.servlet.context-path=/wallet_service/api
server.compression.enabled=true

# ===============================
# gRPC SERVER CONFIGURATION
# ===============================
grpc.server.port=9095
grpc.server.enable-reflection=true
logging.level.io.grpc=DEBUG
logging.level.io.netty=DEBUG

# This makes Spring Boot use Virtual Threads for all Web and Task execution
spring.threads.virtual.enabled=true
spring.kafka.listener.type=single
spring.kafka.listener.concurrency=3
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=health


# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/central
spring.datasource.username=central
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=WalletServiceHikariCP

# Kafka Configuration
spring.kafka.producer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=wallet-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Kafka Topics
kafka.topics.user-events=user-events

# Logging
logging.level.com.central=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.central.wallet_service.scehduler=DEBUG
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.pool=TRACE
logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


threading.cpu.pool-size=4
threading.cpu.name-prefix=cpu-pf-
